opencollection: 1.0.0
info:
  name: laravel_postcode_restapi
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: login
      type: http
      seq: 1
    http:
      method: POST
      url: '{{url}}/api/users/login'
      body:
        type: json
        data: |-
          {
            "email": "test@test.com",
            "password": "12345678"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: users-list
      type: http
      seq: 2
    http:
      method: GET
      url: '{{url}}/api/users'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: counties-list
      type: http
      seq: 3
    http:
      method: GET
      url: '{{url}}/api/counties?needle=Bar'
      params:
        - name: needle
          value: Bar
          type: query
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: add-county
      type: http
      seq: 4
    http:
      method: POST
      url: '{{url}}/api/counties'
      body:
        type: json
        data: |-
          {
            "name": "Budapest",
            "badge_url": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4wiV7nr9qkAPG_nbiFPYR2LsNFLhfLG0s59ujUev-bA&s=10"
          }
      auth:
        type: bearer
        token: '{{token}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: edit-county
      type: http
      seq: 5
    http:
      method: PUT
      url: '{{url}}/api/counties/20'
      body:
        type: json
        data: |-
          {
            "name": "Budapest",
            "badge_url": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS4wiV7nr9qkAPG_nbiFPYR2LsNFLhfLG0s59ujUev-bA&s=10"
          }
      auth:
        type: bearer
        token: '{{token}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: county
      type: http
      seq: 6
    http:
      method: GET
      url: '{{url}}/api/counties/1'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: cities-list
      type: http
      seq: 7
    http:
      method: GET
      url: '{{url}}/api/cities'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: city
      type: http
      seq: 8
    http:
      method: GET
      url: '{{url}}/api/cities'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: add-city
      type: http
      seq: 9
    http:
      method: POST
      url: '{{url}}/api/cities'
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-10-12T13:24:20.011Z'
    exportedUsing: Bruno
